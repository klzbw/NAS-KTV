name: tvOS Build

on:
  push:
    tags:
      - 'v*'
    paths:
      - 'packages/tvos-app/**'
      - '.github/workflows/tvos-build.yml'
  workflow_dispatch:
    inputs:
      configuration:
        description: 'Build configuration'
        required: true
        default: 'Release'
        type: choice
        options:
          - Debug
          - Release
      sign:
        description: 'Sign app (requires certificates)'
        required: true
        default: false
        type: boolean

env:
  PROJECT_PATH: packages/tvos-app
  SCHEME: NASKTV
  CONFIGURATION: ${{ github.event.inputs.configuration || 'Release' }}

jobs:
  build:
    name: Build tvOS App
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode versions
        run: |
          echo "=== Available Xcode versions ==="
          ls -la /Applications/ | grep Xcode
          echo ""
          echo "=== Current Xcode ==="
          xcodebuild -version
          xcode-select -p
          echo ""
          echo "=== Available SDKs ==="
          xcodebuild -showsdks | grep -i tvos

      - name: Select latest Xcode
        run: |
          # 自动选择最新的Xcode
          LATEST_XCODE=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$LATEST_XCODE" ]; then
            echo "Selecting Xcode: $LATEST_XCODE"
            sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"
          fi
          xcodebuild -version

      - name: Verify project file
        run: |
          cd ${{ env.PROJECT_PATH }}
          echo "=== Project file exists ==="
          ls -la NASKTV.xcodeproj/
          echo ""
          echo "=== Project info ==="
          xcodebuild -list -project NASKTV.xcodeproj 2>&1 || echo "xcodebuild -list failed"
          echo ""
          echo "=== Source files ==="
          find NASKTV -name "*.swift" | sort

      - name: Install Apple Certificate (if signed)
        if: ${{ github.event.inputs.sign == 'true' || startsWith(github.ref, 'refs/tags/v') }}
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE }}
          p12-password: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          keychain: ${{ github.runner }}.keychain

      - name: Install Provisioning Profile (if signed)
        if: ${{ github.event.inputs.sign == 'true' || startsWith(github.ref, 'refs/tags/v') }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "${{ secrets.TVOS_PROVISIONING_PROFILE }}" | base64 -d > ~/Library/MobileDevice/Provisioning\ Profiles/NASKTV_tvOS.mobileprovision
          echo "Provisioning profile installed"
          ls -la ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Build (Unsigned - Simulator)
        if: ${{ github.event.inputs.sign != 'true' && !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          cd ${{ env.PROJECT_PATH }}
          
          # 预先创建.app目录并复制Info.plist（解决验证阶段找不到Info.plist的问题）
          APP_PATH="build/Build/Products/${{ env.CONFIGURATION }}-appletvsimulator/NASKTV.app"
          mkdir -p "$APP_PATH"
          if [ -f "NASKTV/Info.plist" ]; then
            cp NASKTV/Info.plist "$APP_PATH/Info.plist"
            echo "Info.plist pre-copied to $APP_PATH"
          fi
          
          echo "=== Starting build ==="
          xcodebuild \
            -project NASKTV.xcodeproj \
            -scheme NASKTV \
            -configuration "${{ env.CONFIGURATION }}" \
            -sdk appletvsimulator \
            -destination 'generic/platform=tvOS Simulator' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log
          BUILD_EXIT=${PIPESTATUS[0]}
          echo ""
          echo "=== Build exit code: $BUILD_EXIT ==="
          
          # 如果第一次构建失败（验证问题），复制Info.plist后重试一次
          if [ $BUILD_EXIT -ne 0 ]; then
            echo "=== First build failed, retrying with Info.plist ==="
            if [ -d "$APP_PATH" ] && [ -f "NASKTV/Info.plist" ]; then
              cp NASKTV/Info.plist "$APP_PATH/Info.plist"
              echo "Info.plist copied, retrying build..."
              xcodebuild \
                -project NASKTV.xcodeproj \
                -scheme NASKTV \
                -configuration "${{ env.CONFIGURATION }}" \
                -sdk appletvsimulator \
                -destination 'generic/platform=tvOS Simulator' \
                -derivedDataPath build \
                CODE_SIGN_IDENTITY="" \
                CODE_SIGNING_REQUIRED=NO \
                CODE_SIGNING_ALLOWED=NO \
                build 2>&1 | tee build2.log
              BUILD_EXIT=${PIPESTATUS[0]}
              echo "=== Retry build exit code: $BUILD_EXIT ==="
            fi
          fi
          
          if [ $BUILD_EXIT -ne 0 ]; then
            echo "=== Build failed, showing last 100 lines ==="
            tail -100 build.log
            exit $BUILD_EXIT
          fi

      - name: Archive (Signed - Release)
        if: ${{ github.event.inputs.sign == 'true' || startsWith(github.ref, 'refs/tags/v') }}
        run: |
          cd ${{ env.PROJECT_PATH }}
          echo "=== Starting archive ==="
          xcodebuild \
            -project NASKTV.xcodeproj \
            -scheme NASKTV \
            -configuration Release \
            -sdk appletvos \
            -destination 'generic/platform=tvOS' \
            -archivePath build/NASKTV.xcarchive \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="NASKTV tvOS" \
            archive 2>&1 | tee archive.log
          ARCHIVE_EXIT=${PIPESTATUS[0]}
          echo "Archive exit code: $ARCHIVE_EXIT"
          if [ $ARCHIVE_EXIT -ne 0 ]; then
            tail -100 archive.log
            exit $ARCHIVE_EXIT
          fi

      - name: Export IPA (Signed)
        if: ${{ github.event.inputs.sign == 'true' || startsWith(github.ref, 'refs/tags/v') }}
        run: |
          cd ${{ env.PROJECT_PATH }}
          cat > ExportOptions.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>destination</key>
              <string>export</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>stripSwiftSymbols</key>
              <true/>
              <key>teamID</key>
              <string>${{ secrets.APPLE_TEAM_ID }}</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.nasktv.app</key>
                  <string>NASKTV tvOS</string>
              </dict>
          </dict>
          </plist>
          EOF

          xcodebuild \
            -exportArchive \
            -archivePath build/NASKTV.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist ExportOptions.plist 2>&1 | tee export.log
          EXPORT_EXIT=${PIPESTATUS[0]}
          echo "Export exit code: $EXPORT_EXIT"
          if [ $EXPORT_EXIT -ne 0 ]; then
            tail -100 export.log
            exit $EXPORT_EXIT
          fi

      - name: Package Simulator Build
        if: ${{ github.event.inputs.sign != 'true' && !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          cd ${{ env.PROJECT_PATH }}
          echo "=== Looking for built app ==="
          find build/Build/Products -name "*.app" -type d 2>/dev/null
          APP_PATH=$(find build/Build/Products -name "NASKTV.app" -type d | head -1)
          echo "App path: $APP_PATH"
          if [ -n "$APP_PATH" ]; then
            mkdir -p build/output
            cp -R "$APP_PATH" build/output/
            cd build/output
            zip -r ../NASKTV-tvOS-Simulator.zip NASKTV.app
            echo "Simulator build packaged successfully"
            ls -la ../NASKTV-tvOS-Simulator.zip
          else
            echo "WARNING: No app found, listing build directory"
            find build -type f | head -50
          fi

      - name: Build Unsigned IPA (Device)
        if: ${{ github.event.inputs.sign != 'true' && !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          cd ${{ env.PROJECT_PATH }}
          echo "=== Building unsigned device version ==="
          
          # 预先创建.app目录并复制Info.plist
          DEVICE_APP_PATH="build/Build/Products/Release-appletvos/NASKTV.app"
          mkdir -p "$DEVICE_APP_PATH"
          if [ -f "NASKTV/Info.plist" ]; then
            cp NASKTV/Info.plist "$DEVICE_APP_PATH/Info.plist"
            echo "Info.plist pre-copied"
          fi
          
          # 构建真实设备版本（不签名）
          xcodebuild \
            -project NASKTV.xcodeproj \
            -scheme NASKTV \
            -configuration Release \
            -sdk appletvos \
            -destination 'generic/platform=tvOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build-device.log
          BUILD_EXIT=${PIPESTATUS[0]}
          echo "Device build exit code: $BUILD_EXIT"
          
          # 如果第一次构建失败，复制Info.plist后重试
          if [ $BUILD_EXIT -ne 0 ]; then
            echo "First device build failed, retrying..."
            if [ -d "$DEVICE_APP_PATH" ] && [ -f "NASKTV/Info.plist" ]; then
              cp NASKTV/Info.plist "$DEVICE_APP_PATH/Info.plist"
              xcodebuild \
                -project NASKTV.xcodeproj \
                -scheme NASKTV \
                -configuration Release \
                -sdk appletvos \
                -destination 'generic/platform=tvOS' \
                -derivedDataPath build \
                CODE_SIGN_IDENTITY="" \
                CODE_SIGNING_REQUIRED=NO \
                CODE_SIGNING_ALLOWED=NO \
                build 2>&1 | tee build-device2.log
              BUILD_EXIT=${PIPESTATUS[0]}
              echo "Retry device build exit code: $BUILD_EXIT"
            fi
          fi
          
          if [ $BUILD_EXIT -ne 0 ]; then
            echo "Device build failed, showing last 100 lines"
            tail -100 build-device.log
            exit $BUILD_EXIT
          fi
          
          echo "=== Packaging unsigned IPA ==="
          # 找到构建好的.app
          DEVICE_APP=$(find build/Build/Products -path "*appletvos*" -name "NASKTV.app" -type d | head -1)
          echo "Device app path: $DEVICE_APP"
          
          if [ -n "$DEVICE_APP" ]; then
            # 创建IPA结构
            mkdir -p build/ipa/Payload
            cp -R "$DEVICE_APP" build/ipa/Payload/
            
            # 确保Info.plist存在
            if [ ! -f "build/ipa/Payload/NASKTV.app/Info.plist" ] && [ -f "NASKTV/Info.plist" ]; then
              cp NASKTV/Info.plist build/ipa/Payload/NASKTV.app/Info.plist
            fi
            
            # 压缩成IPA
            cd build/ipa
            zip -r ../NASKTV-tvOS-Unsigned.ipa Payload
            cd ../..
            
            echo "Unsigned IPA packaged successfully"
            ls -la build/NASKTV-tvOS-Unsigned.ipa
            
            # 显示IPA内容
            echo "=== IPA contents ==="
            unzip -l build/NASKTV-tvOS-Unsigned.ipa | head -30
          else
            echo "WARNING: No device app found"
            find build/Build/Products -type d | head -20
          fi

      - name: Upload Build Artifact (Simulator)
        if: ${{ github.event.inputs.sign != 'true' && !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: NASKTV-tvOS-Simulator
          path: packages/tvos-app/build/NASKTV-tvOS-Simulator.zip
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Build Artifact (Unsigned IPA)
        if: ${{ github.event.inputs.sign != 'true' && !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: NASKTV-tvOS-Unsigned-IPA
          path: packages/tvos-app/build/NASKTV-tvOS-Unsigned.ipa
          retention-days: 90
          if-no-files-found: warn

      - name: Upload Build Artifact (IPA)
        if: ${{ github.event.inputs.sign == 'true' || startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: NASKTV-tvOS
          path: packages/tvos-app/build/export/*.ipa
          retention-days: 90
          if-no-files-found: warn

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            packages/tvos-app/build.log
            packages/tvos-app/archive.log
            packages/tvos-app/export.log
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload to Release (Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            packages/tvos-app/build/export/*.ipa
          fail_on_unmatched_files: false
