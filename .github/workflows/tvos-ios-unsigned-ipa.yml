name: tvOS/iOS Unsigned IPA Build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Build platform'
        required: true
        default: 'both'
        type: choice
        options:
          - tvos
          - ios
          - both
      configuration:
        description: 'Build configuration'
        required: true
        default: 'Release'
        type: choice
        options:
          - Debug
          - Release

jobs:
  build-tvos:
    if: ${{ github.event.inputs.platform == 'tvos' || github.event.inputs.platform == 'both' }}
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build tvOS
        run: |
          cd packages/tvos-app
          xcodebuild build \
            -project NASKTV.xcodeproj \
            -scheme NASKTV \
            -configuration ${{ github.event.inputs.configuration }} \
            -sdk appletvos \
            -destination 'generic/platform=tvOS' \
            -derivedDataPath build/tvos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=NO

      - name: Package tvOS IPA
        run: |
          cd packages/tvos-app
          APP_PATH="build/tvos/Build/Products/${{ github.event.inputs.configuration }}-appletvos/NASKTV.app"
          PAYLOAD_DIR="build/tvos/Payload"
          mkdir -p "$PAYLOAD_DIR"
          cp -R "$APP_PATH" "$PAYLOAD_DIR/"
          cd build/tvos
          zip -r "NASKTV-tvOS-unsigned-${{ github.event.inputs.configuration }}.ipa" Payload
          ls -la "NASKTV-tvOS-unsigned-${{ github.event.inputs.configuration }}.ipa"

      - name: Upload tvOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: NASKTV-tvOS-unsigned-ipa
          path: packages/tvos-app/build/tvos/NASKTV-tvOS-unsigned-${{ github.event.inputs.configuration }}.ipa
          retention-days: 30

  build-ios:
    if: ${{ github.event.inputs.platform == 'ios' || github.event.inputs.platform == 'both' }}
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build iOS
        run: |
          cd packages/tvos-app
          xcodebuild build \
            -project NASKTV.xcodeproj \
            -scheme NASKTV \
            -configuration ${{ github.event.inputs.configuration }} \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=NO

      - name: Package iOS IPA
        run: |
          cd packages/tvos-app
          APP_PATH="build/ios/Build/Products/${{ github.event.inputs.configuration }}-iphoneos/NASKTV.app"
          PAYLOAD_DIR="build/ios/Payload"
          mkdir -p "$PAYLOAD_DIR"
          cp -R "$APP_PATH" "$PAYLOAD_DIR/"
          cd build/ios
          zip -r "NASKTV-iOS-unsigned-${{ github.event.inputs.configuration }}.ipa" Payload
          ls -la "NASKTV-iOS-unsigned-${{ github.event.inputs.configuration }}.ipa"

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: NASKTV-iOS-unsigned-ipa
          path: packages/tvos-app/build/ios/NASKTV-iOS-unsigned-${{ github.event.inputs.configuration }}.ipa
          retention-days: 30
